<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="border-bottom border-light-subtle">
        <nav class="navbar navbar-expand-md px-3 px-md-4 py-3">
            <a class="navbar-brand p-0" href="index.html" aria-label="Inicio">
                <span class="brand-initial">J</span>
            </a>
            <button class="navbar-toggler border-0 p-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Mostrar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="mainNav">
                <ul class="navbar-nav gap-md-2 text-uppercase fw-semibold small">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Sobre mi</a></li>
                    <li class="nav-item"><a class="nav-link" href="proyecto.html">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="herramientas.html">Herramientas</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contecto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="px-3 px-md-4 py-4 py-md-5">
        <section class="mb-4 mb-md-5">
            <h1 class="text-center fw-bold mb-2">Contacto</h1>
            <div class="d-flex justify-content-center mb-4">
                <span class="title-underline"></span>
            </div>

            <div class="row g-4">
                <div class="col-12 col-md-7">
                    <div class="card rounded-4 p-4 shadow-soft contact-card">
                        <form>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Nombre</label>
                                <input type="text" class="form-control contact-input" placeholder="Jorge">
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control contact-input" placeholder="jorge@email.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Asunto</label>
                                <input type="text" class="form-control contact-input" placeholder="Proyecto">
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Mensaje</label>
                                <textarea class="form-control contact-input" rows="6" placeholder="Hola, me gustaría trabajar contigo en un proyecto."></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-brand">Enviar mensaje</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-12 col-md-5">
                    <div class="card rounded-4 p-3 mb-4 shadow-soft contact-info">
                        <h3 class="h5 fw-bold mb-3">Información</h3>
                        <ul class="list-unstyled mb-0">
                            <li class="d-flex align-items-center mb-3"><i class="bi bi-envelope-fill me-3 text-primary"></i> <span>jorge@email.com</span></li>
                            <li class="d-flex align-items-center mb-3"><i class="bi bi-telephone-fill me-3 text-primary"></i> <span>+52 981 123 4567</span></li>
                            <li class="d-flex align-items-center"><i class="bi bi-geo-alt-fill me-3 text-primary"></i> <span>Campeche, México</span></li>
                        </ul>
                    </div>

                    <div class="card rounded-4 p-3 shadow-soft follow-card">
                        <h4 class="h6 fw-bold mb-3">Sígueme</h4>
                        <div class="d-flex gap-3">
                            <a href="#" class="social-icon"><i class="bi bi-x-lg"></i></a>
                            <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
                            <a href="#" class="social-icon"><i class="bi bi-github"></i></a>
                            <a href="#" class="social-icon"><i class="bi bi-youtube"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
